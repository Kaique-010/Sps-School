name: Deploy em produção

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy no servidor com mirror
    runs-on: ubuntu-latest
    environment: SPS-SCHOOL

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy no servidor
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'EOF'
            set -e

            cd /home/ubuntu/Sps-School/backend

            source ../venv/bin/activate

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            pip install -r requirements.txt

            python manage.py migrate

            python manage.py collectstatic --noinput

            sudo systemctl restart gunicorn
            sudo systemctl reload nginx
          EOF

      - name: Espelhar para repositório da empresa
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e
          git remote remove empresa 2>/dev/null || true
          git remote add empresa \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/spartacusWeb25/Sps-School.git"
          git fetch empresa main || true
          git push empresa "HEAD:refs/heads/main" --force

  mirror:
    name: Diagnosticar acesso ao repositório empresa
    runs-on: ubuntu-latest
    environment: SPS-SCHOOL

    steps:
      - name: Verificar identidade do token
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e

          echo "=== IDENTIDADE DO TOKEN ==="

          curl -fSs \
            -H "Authorization: Bearer ${MIRROR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/user

      - name: Verificar acesso ao repositório
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e

          echo "=== REPOSITÓRIO DESTINO ==="

          curl -fSs \
            -H "Authorization: Bearer ${MIRROR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/spartacusWeb25/Sps-School

      - name: Verificar permissões do token
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -e

          echo "=== PERMISSÕES ==="

          curl -i -sS \
            -H "Authorization: Bearer ${MIRROR_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/spartacusWeb25/Sps-School \
            | grep -i "x-oauth-scopes\|x-accepted-oauth-scopes" || true
