name: spsschool
description: "SPS School - Sistema de Treinamentos Spartacus"
publish_to: 'none'
version: 1.0.0+1


environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  cupertino_icons: ^1.0.8
  video_player: ^2.8.1
  youtube_player_flutter: ^9.0.1
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"