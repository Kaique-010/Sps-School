{%load static%}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SPS | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%);
        color: #e5e7eb;
      }
      .brand { font-weight: 700; letter-spacing: .5px; }
      .login-card {
        backdrop-filter: blur(6px);
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
      }
      .form-control, .btn { border-radius: 10px; }
      .btn-primary { background: #2563eb; border-color: #2563eb; }
      .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
      .footer-note { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="p-4 p-md-5 login-card shadow-sm">
            <div class="text-center mb-4">
              <img src="{% static 'logo.png' %}" alt="Logo" style="width: 50px; height: 50px;"> 
              <div class="brand h4 mb-1">SPS School</div>
              <div class="footer-note small">Acesse com seu usuário e senha</div>
            </div>

            <div id="alert" class="alert d-none" role="alert"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="username" placeholder="seu.usuario" required>
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
            </form>

            <div class="mt-4 text-center footer-note">
              <small>Precisa de ajuda? Fale com o suporte.</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const alertBox = document.getElementById('alert');
      const showAlert = (message, type = 'info') => {
        alertBox.className = `alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
      };

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          showAlert('Informe usuário e senha.', 'warning');
          return;
        }

        try {
          // 1) Login de sessão para templates web
          const sessionResp = await fetch('/api/auth/session-login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const sessionData = await sessionResp.json();
          if (!sessionResp.ok || !sessionData?.sucesso) {
            const mensagem = sessionData?.mensagem || 'Falha na autenticação';
            showAlert(mensagem, 'danger');
            return;
          }

          // 2) Opcional: obter tokens JWT (para futuras chamadas via JS)
          try {
            const jwtResp = await fetch('/api/auth/login/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });
            const jwtData = await jwtResp.json();
            if (jwtResp.ok && jwtData?.sucesso) {
              const { access, refresh } = jwtData.dados?.tokens || {};
              localStorage.setItem('sps_access_token', access || '');
              localStorage.setItem('sps_refresh_token', refresh || '');
            }
          } catch {}

          showAlert('Login realizado com sucesso. Redirecionando...', 'success');
          setTimeout(() => {
            window.location.href = '/home/';
          }, 600);
        } catch (err) {
          console.error(err);
          showAlert('Erro de conexão com o servidor.', 'danger');
        }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
